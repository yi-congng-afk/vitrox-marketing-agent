[build]
  functions = "netlify/functions"
  publish = "store"

[functions]
  node_bundler = "esbuild"

# Overdue-loan reminder emails: every day at 09:00 Malaysia time (01:00 UTC).
[functions."store-reminders"]
  schedule = "0 1 * * *"

# The dashboard used to live under /store/ — keep old bookmarks working.
[[redirects]]
  from = "/store"
  to = "/"
  status = 302

[[redirects]]
  from = "/store/*"
  to = "/:splat"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    # Always check for the newest page/script, so an update is seen right away.
    Cache-Control = "no-cache"
    # Internal tool: keep it out of search engines and out of other sites' frames.
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
