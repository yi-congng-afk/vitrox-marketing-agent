[build]
  functions = "netlify/functions"
  publish = "store"

[functions]
  node_bundler = "esbuild"

# The dashboard used to live under /store/ — keep old bookmarks working.
[[redirects]]
  from = "/store"
  to = "/"
  status = 302

[[redirects]]
  from = "/store/*"
  to = "/:splat"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
